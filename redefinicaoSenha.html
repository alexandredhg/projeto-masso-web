<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Página de Redefinição de Senha</title>
        <link rel="stylesheet" href="css/redefinicaoSenha.css"/>
    </head>
    <body>
         <a class="skip-link" href="#conteudo-principal">
        Ir Para o Conteúdo Principal
    </a>

    <div class="container-switch">
        <label class="switch" for="theme-toggle">
            <span id="switch-label">Modo Escuro</span>
            <input type="checkbox" id="theme-toggle" role="switch" aria-labelledby="switch-label" aria-checked="false">
            <span class="slider"></span>
        </label>
    </div>


    <header>

        

        
        <div class="containerTitulos">
            <h1>Redefinição de Senha</h1>

            <h2>Ambulatório de Massoterapia</h2>
        </div>

    </header>

    <main id="conteudo-principal">

        <h3>Página de Redefinição de Senhas</h3>

        <h4>Formulário de Redefinição de Senha:</h4>

        <form id="formRedefinicaoSenha" class="centralForm">           


            <div class="containerSenha">

                <label class="labelSen" for="txtSenha">* Senha:</label>

                <input class="inputSenha" type="password" id="txtSenha" />
                <button type="button" id="toggleSenha" class="btnMostrar">Mostrar</button>


            </div>

            <div class="containerSenha">

                <label class="labelSen" for="txtSenha">* Confirmar Senha:</label>

                <input class="inputSenha" type="password" id="txtSenha" />
                <button type="button" id="toggleSenha" class="btnMostrar">Mostrar</button>


            </div>


           <div class="containerButton">
                  <button class="button" type="submit" id="btnSubmit">Cadastrar</button>
                </div>

        
            <!--<div>
                    <a href="areaRestrita.html"></a>
                </div> -->
        </form>
        
        <!--<hr/>-->

        <div id="divMensagem" role="alert" aria-live="assertive" class="msg"></div>

         <div class="containerVoltar">        
                <a class="voltar" href="javaScript: history.back()">Voltar</a>            
            </div>


        <div class="voltarTopo">
            <button class="btnVoltarTopo" id="btnVoltarTopo" title="Voltar para o topo">Topo</button>
        </div>

    </main>

         
        
    </body>
    <script type="module" src="dist/redefinicaoSenha.js"></script>

    <script type="module" src="dist/voltarTopo.js"></script>

    <script type="module" src="dist/modoEscuro.js"></script>
</html>
