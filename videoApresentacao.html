<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Página do Vídeo de Apresentação</title>
        <link rel="stylesheet" href="css/videoApresentacao.css">
        <link rel="stylesheet" href="css/estilos.css">
    </head>

    <body>        

        <div class="container-switch">
            <label class="switch" for="theme-toggle">
                <span id="switch-label">Modo Escuro</span>
                <input type="checkbox" id="theme-toggle" role="switch" aria-labelledby="switch-label" aria-checked="false">
                <span class="slider"></span>
            </label>
        </div>


        <header>
            <div id="cabecalho"></div>            
        </header>

        <main id="conteudo-principal">

            <h3>Vídeo de Apresentação</h3>

            <h4>Assista o Vídeo do Curso:</h4>

            <div>

                <video controls class="video" width="100%" height="100%">
                    <source src="Videos/videoApresentacaoCurso/VideoApresentacao.mp4">
                </video>
            </div>
            <br><br>
            <div class="sair">
                <br>
                <a href="index.html"></a>
            </div>            

        </main>

        <!--"hr"Fubção Cria uma Linha Horizontal no Código-->
        <hr>

        <footer>
            <div id="rodape"></div>
                </footer>


        <!--Script-->
        <script defer  type="module"  src="dist/cabecalho.js"></script>
        <script type="module" src="dist/voltarTopo.js"></script>

        <script type="module" src="dist/modoEscuro.js"></script>

        <script defer  type="module"  src="dist/rodaoe.js"></script>

    </body>

</html>
